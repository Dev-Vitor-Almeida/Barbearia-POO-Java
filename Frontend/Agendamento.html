<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento | Barbearia Mestre das Tesouras</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body class="auth-page">
    <header class="topbar">
        <a class="brand" href="Index.html">
            <span class="brand-mark">
                <img src="icones/barbearia.png" alt="">
            </span>
            <span>
                <strong>Mestre das Tesouras</strong>
                <small>Barbearia premium</small>
            </span>
        </a>

        <nav class="menu" aria-label="Menu principal">
            <a href="Index.html">Início</a>
            <a href="Login.html">Login</a>
            <a href="Cadastro.html">Cadastro</a>
            <a href="Agendamento.html">Agendamento</a>
            <a href="Painel.html" data-auth-link hidden>Painel</a>
            <a href="#" data-logout-link hidden>Sair</a>
        </nav>
    </header>

    <main class="form-screen schedule-screen">
        <section class="form-panel">
            <p class="eyebrow">Reserve seu horário</p>
            <h1>Agendamento</h1>
            <p class="form-intro">Escolha o serviço, data e profissional para garantir seu atendimento.</p>

            <form class="premium-form" data-form="agendamento">
                <label for="cliente">Nome</label>
                <input id="cliente" name="cliente" type="text" placeholder="Seu nome" required>

                <label for="servico">Serviço</label>
                <select id="servico" name="servico" required>
                    <option value="">Selecione um serviço</option>
                    <option>Corte premium</option>
                    <option>Barba completa</option>
                    <option>Corte + barba</option>
                    <option>Sobrancelha</option>
                </select>

                <div class="form-grid">
                    <div>
                        <label for="data">Data</label>
                        <input id="data" name="data" type="date" required>
                    </div>

                    <div>
                        <label for="horario">Horário</label>
                        <input id="horario" name="horario" type="time" required>
                    </div>
                </div>

                <label for="barbeiro">Barbeiro</label>
                <select id="barbeiro" name="barbeiro" required>
                    <option value="">Escolha um profissional</option>
                    <option>James</option>
                    <option>David</option>
                    <option>Jappa</option>
                </select>

                <button class="btn btn-primary" type="submit">Confirmar agendamento</button>
            </form>
        </section>
    </main>
    <script src="Script.js"></script>
</body>
</html>
