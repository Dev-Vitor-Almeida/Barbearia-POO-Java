<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Barbearia Mestre das Tesouras</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body class="auth-page">
    <header class="topbar">
        <a class="brand" href="Index.html">
            <span class="brand-mark">
                <img src="icones/barbearia.png" alt="">
            </span>
            <span>
                <strong>Mestre das Tesouras</strong>
                <small>Barbearia premium</small>
            </span>
        </a>

        <nav class="menu" aria-label="Menu principal">
            <a href="Index.html">Início</a>
            <a href="Login.html">Login</a>
            <a href="Cadastro.html">Cadastro</a>
            <a href="Agendamento.html">Agendamento</a>
            <a href="Painel.html" data-auth-link hidden>Painel</a>
            <a href="#" data-logout-link hidden>Sair</a>
        </nav>
    </header>

    <main class="form-screen">
        <section class="form-panel">
            <p class="eyebrow">Novo cliente</p>
            <h1>Criar cadastro</h1>
            <p class="form-intro">Deixe seus dados prontos para agendar cortes, barba e acabamentos com mais rapidez.</p>

            <form class="premium-form" data-form="cadastro">
                <label for="nome">Nome completo</label>
                <input id="nome" name="nome" type="text" placeholder="Seu nome" required>

                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" placeholder="(00) 00000-0000" required>

                <label for="cpf">CPF</label>
                <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" required>

                <label for="email-cadastro">E-mail</label>
                <input id="email-cadastro" name="email" type="email" placeholder="seuemail@exemplo.com" required>

                <label for="senha-cadastro">Senha</label>
                <input id="senha-cadastro" name="senha" type="password" placeholder="Crie uma senha" required>

                <button class="btn btn-primary" type="submit">Cadastrar</button>
            </form>

            <p class="form-link">Já tem conta? <a href="Login.html">Entrar</a></p>
        </section>
    </main>
    <script src="Script.js"></script>
</body>
</html>
